name: Telegram AI Quiz Scheduler

on:
  schedule:
    - cron: "*/10 * * * *"   # Every 2 minutes
  workflow_dispatch:

jobs:
  send:
    runs-on: ubuntu-latest

    steps:
      - name: Call send.php
        run: |
          curl --location \
               --retry 3 \
               --retry-delay 5 \
               --connect-timeout 30 \
               --max-time 180 \
               --user-agent "Mozilla/5.0" \
               "https://telegram-ai-quiz-eqay.onrender.com/send.php"
