name: Telegram AI Quiz Scheduler

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - name: Call send.php
        run: |
          curl --location \
               --retry 3 \
               --retry-delay 5 \
               --connect-timeout 30 \
               --max-time 180 \
               --user-agent "Mozilla/5.0 (Windows NT 10.0; Win64; x64)" \
               "https://brni.great-site.net/send.php"
